# Stable BotSORT Configuration for Single Camera CCTV
# PHASE 2: Improved Tracking Stability
# Optimized to reduce ID switching during occlusions and crossings

tracker_type: botsort

# Detection thresholds
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.8  # Increased from 0.6 for more stable new tracks

# PHASE 3: Further increased track buffer for maximum occlusion handling
track_buffer: 120  # Keep tracks alive for 120 frames during occlusion (4 seconds at 30fps)

# PHASE 3: Stricter matching thresholds for better ID stability
match_thresh: 0.9  # Higher = stricter matching (prevent false matches)
proximity_thresh: 0.7  # Spatial proximity weight
appearance_thresh: 0.25  # Lower appearance weight (rely more on motion)

# Score fusion
fuse_score: True

# ReID settings - DISABLED for single camera
with_reid: False

# Camera motion compensation
gmc_method: "sparseOptFlow"

# Device
device: cpu

# Track lifecycle
max_age: 60  # Increased from 30 - keep tracks longer
min_hits: 3  # Require 3 consecutive detections before confirming track

# Additional stability settings
iou_threshold: 0.3  # IoU threshold for matching
